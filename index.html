<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ビリヤードの撞点(タップ位置)を作成して画像として保存できるツール">
  <meta name="theme-color" content="#14532d">
  <title>撞点メーカー</title>
  <!-- style.css / app.js を変更したら ?v= の数字を上げること (モバイルのキャッシュ対策) -->
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='white' stroke='%23ccc' stroke-width='2'/><path d='M50 4v92M4 50h92' stroke='%23bbb' stroke-width='3'/><circle cx='50' cy='62' r='9' fill='%232b7de9'/></svg>">
</head>
<body>
  <header class="app-header">
    <h1>撞点メーカー</h1>
    <p class="subtitle" id="subtitle">ボールをタップして撞点、右のバーでパワーを調整</p>
  </header>

  <main class="app-main">
    <nav class="tabs" aria-label="モード切り替え">
      <button type="button" id="tab-single" class="tab active">シングル</button>
      <button type="button" id="tab-multi" class="tab">マルチ</button>
    </nav>

    <div class="canvas-wrap" id="panel-single">
      <canvas id="ball-canvas" aria-label="手玉の撞点エディタ"></canvas>
    </div>
    <div class="canvas-wrap hidden-panel" id="panel-multi">
      <canvas id="multi-canvas" aria-label="複数撞点エディタ"></canvas>
    </div>

    <div class="readout" id="readout" aria-live="polite">中央</div>

    <div class="controls">
      <button type="button" id="copy-btn" class="btn btn-primary">画像をコピー</button>
      <button type="button" id="share-btn" class="btn btn-primary">共有</button>
      <button type="button" id="save-btn" class="btn btn-secondary">画像を保存</button>
      <button type="button" id="undo-btn" class="btn btn-secondary hidden">1つ戻す</button>
      <button type="button" id="reset-btn" class="btn btn-secondary">リセット</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <footer class="app-footer">
    <small>撞点メーカー — Billiard Hit Position Image Creator</small>
  </footer>

  <script src="app.js?v=5"></script>
</body>
</html>
